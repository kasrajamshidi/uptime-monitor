services:

  postgres:
    image: postgres:16
    container_name: uptime-postgres

    environment:
      POSTGRES_DB: uptime
      POSTGRES_USER: uptime
      POSTGRES_PASSWORD: uptime_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped


  backend:
    build:
      context: ./backend

    container_name: uptime-backend

    environment:
      DATABASE_URL: postgresql://uptime:uptime_password@postgres:5432/uptime

    ports:
      - "8000:8000"

    depends_on:
      - postgres

    restart: unless-stopped


  worker:
    build:
      context: ./worker

    container_name: uptime-worker

    environment:
      BACKEND_URL: http://backend:8000

    depends_on:
      - backend

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend

    container_name: uptime-frontend

    ports:
      - "80:80"

    depends_on:
      - backend

    restart: unless-stopped


volumes:

  postgres_data:
